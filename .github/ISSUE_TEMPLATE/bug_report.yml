name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The version and platform fields below are required because
        they routinely decide whether something is an already-shipped fix or a live bug —
        without them the first reply is always "which version?", which costs you a day.
  - type: input
    id: version
    attributes:
      label: infra-TAK version
      description: "`grep '^VERSION' app.py` in your install directory, or read it off the console sidebar."
      placeholder: "e.g. v10.1.54-alpha"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Ubuntu 22.04
        - Rocky Linux / RHEL 9
        - Other (say which below)
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x86_64
        - ARM64 / aarch64
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: Install type
      options:
        - Single server (TAK Server and console on one host)
        - Split two-server (TAK Server and console, or database, on different hosts)
        - Container TAK Server (Docker)
        - Remote or external database
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Where it runs
      options:
        - Cloud (AWS, Azure, Oracle, other)
        - On-prem or home lab
        - Not sure
    validations:
      required: true
  - type: input
    id: takserver
    attributes:
      label: TAK Server version
      description: "Optional. The version of the zip, deb or rpm from tak.gov that you installed."
      placeholder: "e.g. 5.4-RELEASE-xx"
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Name the page or module (TAK Server, Authentik, TAK Portal, CloudTAK, Guard Dog...) if you can.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### Diagnostics report: email it, don't attach it here
        **This repository is public.** The diagnostics report has passwords, tokens and keys
        removed, but it still contains your server's hostnames, IP addresses, usernames and log
        lines. Please **do not attach it to this issue.**

        Instead, in the console go to **Help → Diagnostics → Run diagnostics**, then either
        **Email report** to **takwerx@gmail.com**, or **Download report** and email the file there.
        Put this issue's number in the subject. It usually answers our first round of questions.
  - type: checkboxes
    id: diagnostics
    attributes:
      label: Diagnostics report
      options:
        - label: I have emailed (or will email) the diagnostics report with this issue's number in the subject
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Anything the diagnostics report doesn't cover — `journalctl -u takwerx-console -n 200`,
        `/var/log/takguard/restarts.log`, `docker logs <container>`, TAK Server logs.
        Paste as text rather than a screenshot where you can, so it is searchable.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Anything unusual about the deployment?
      options:
        - label: Split/two-server install (TAK Server and console on different hosts)
        - label: Remote or external Authentik, Caddy, or database
        - label: Behind a relay, VPN, CGNAT, or cloud load balancer
        - label: Non-root console install
