name: throwaway 1189
on:
  push:
    branches: ['claude/issue-1189001']
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-checks-{0}', github.event.pull_request.number) || format('pr-checks-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "sha ${{ github.sha }}"; sleep 45
