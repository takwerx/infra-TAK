name: Claude worker

# Starts one independent Claude worker per @claude comment, on the Mac Studio.
# Only people with write access (AJ, takwerx-agent) can start it.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Private check: what Claude should do (results stay in this run's log, nothing is posted)"
        default: "Say hello and list the top-level files in this repo. Change nothing."
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: github.event_name != 'workflow_dispatch' && contains(github.event.comment.body, '@claude') && !(github.event.comment.user.login == 'takwerx' && contains(github.event.comment.body, 'ship it'))
    runs-on: [self-hosted, macOS, tak-worker]
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-5-5
            --settings /Users/andreasjohansson/tak-agent/workers/worker-settings.json
            --allowedTools "Bash,Edit,MultiEdit,Write,Read,Glob,Grep,WebFetch"
            --append-system-prompt "Before anything else, read /Users/andreasjohansson/tak-agent/workers/WORKER.md and follow it exactly."

  # Private check, started from the Actions tab: nothing is posted anywhere.
  check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, tak-worker]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.task }}
          claude_args: >-
            --model claude-opus-5-5
            --settings /Users/andreasjohansson/tak-agent/workers/worker-settings.json
            --allowedTools "Read,Glob,Grep"

  # AJ comments "ship it" on the issue (or the PR): merge Claude's PR. Only AJ's own comment does this.
  ship:
    if: github.event_name == 'issue_comment' && github.event.comment.user.login == 'takwerx' && contains(github.event.comment.body, 'ship it')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Merge Claude's PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          if [ "$IS_PR" = "true" ]; then PR="$N"; else
            PR="$(gh pr list -R "$REPO" --state open --head "claude/issue-$N" --json number --jq '.[0].number')"
          fi
          if [ -z "$PR" ]; then gh issue comment "$N" -R "$REPO" --body "Nothing to ship: no open Claude PR for this issue."; exit 0; fi
          gh pr ready "$PR" -R "$REPO" || true
          if gh pr merge "$PR" -R "$REPO" --merge --delete-branch; then
            gh issue comment "$N" -R "$REPO" --body "Shipped: merged PR #$PR."
          else
            gh issue comment "$N" -R "$REPO" --body "Couldn't merge PR #$PR (conflict or failing checks). It needs a look."
          fi
