name: PR checks

# Tier 1: automatic checks on every PR into dev (and main), and again on dev and main after each
# merge (ops #691). No Claude involved.
# A red check blocks the merge. Run the same things locally with:
#   python3 -I .github/ci/compile_check.py
#   bash .github/ci/shellcheck_gate.sh
#   python3 -m pytest -q -n auto --basetemp ~/pytest-tmp tests   (basetemp must not be under /tmp; needs pytest-xdist, see .github/ci/requirements-test.txt)
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  # ops #691: also run on the merged tip. Two PRs can each pass alone and break together; only a
  # run on dev (and main) after the merge sees that.
  push:
    branches: [dev, main]

concurrency:
  # ops #1189: a newer push to a PR cancels that PR's older run (nobody needs the old result), but a run
  # on dev or main is never cancelled: a red dev that shows "cancelled" is invisible (ops #1174).
  # Push runs get one group per commit, not one per branch. With cancel-in-progress off, GitHub still
  # cancels a run that is waiting in the group when a newer one arrives, so three quick merges to dev
  # would lose the middle run. One group per commit means no run ever waits behind another.
  group: ${{ github.event_name == 'pull_request' && format('pr-checks-{0}', github.event.pull_request.number) || format('pr-checks-push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: setup-python has no 3.9/3.10 builds for
# newer images, and those are the versions RHEL/Rocky 9 and Ubuntu 22.04 ship.
jobs:
  # 1a. Every tracked .py file compiles on the oldest Python we support (RHEL/Rocky 9 = 3.9).
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python -I .github/ci/compile_check.py
      # simulator/ runs in its own python:3.12 container (simulator/Dockerfile).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -I .github/ci/compile_check.py --only simulator/
      # ETL Runner shim (v10.4.0): pure-logic unit tests, runner's preinstalled Node, no npm.
      - run: node --test modules/etlrunner/shim/test/*.test.mjs

  # 1b. shellcheck, errors only, against a baseline of the findings that already existed.
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Pinned so the baseline means the same thing every run (the runner's own shellcheck moves with the image).
      # Installed by hash from a lock file, so a swapped package on PyPI cannot reach CI (ops #1014).
      - run: pip install --require-hashes -r .github/ci/requirements-shellcheck.lock && shellcheck --version
      - run: bash .github/ci/shellcheck_gate.sh

  # 1c. Which later test tiers this change needs (tools/pick-tests.py, ops #242). Info only:
  #     it writes the checklist to the run summary and never fails the PR.
  pick-tests:
    # A PR's checklist only: on a push there is no base to diff against and nothing left to pick.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo '### Test tiers this change needs'
            python3 -I tools/pick-tests.py --base "origin/$BASE_REF" --head HEAD || echo 'pick-tests could not run (informational only)'
          } >> "$GITHUB_STEP_SUMMARY"

  # 2. The pytest suite in tests/ (Ubuntu 22.04 ships Python 3.10).
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # tests/test_release_hygiene_ops354.py compares app.py's VERSION with the newest release tag. For a
      # PR into dev it reads only the PR's own README, never dev's live tip, so a release cut after the
      # PR branched can't turn it red (ops #435, ops #586).
      - run: git fetch --depth=1 origin 'refs/tags/v*:refs/tags/v*'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/ci/requirements-test.txt
      # By hash (ops #1014), from the console's own requirements.txt plus the test tools (ops #1113).
      # There is no second lock: a Dependabot bump of a pin in either file is the whole change, and these
      # tests run on exactly the packages a customer box installs.
      - run: pip install --require-hashes -r requirements.txt -r .github/ci/requirements-test.txt
      # --basetemp keeps pytest's temp dirs out of /tmp: some Guard Dog tests rewrite '/tmp/' in the
      # script under test to their own tmp_path, which mangles a tmp_path that is itself under /tmp.
      # INFRATAK_CI_BRANCH: on a push run (no PR base) the release-hygiene test holds the dev tip to
      # the same baseline as a PR into dev, and main to the newest tag.
      - env:
          INFRATAK_CI_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python -m pytest -q -n 2 --timeout 300 --durations=10 -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest" tests

  # 2b. The console's requirements.txt installs by hash on every Python a customer box can have (ops #1113):
  # 3.9 (RHEL/Rocky 9 python3), 3.10 (Ubuntu 22.04) and 3.12 (Ubuntu 24.04). A Dependabot bump to a
  # release that needs a newer Python, or a missing transitive pin, goes red here instead of on a box.
  console-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv "$RUNNER_TEMP/console-venv"
      # The same command start.sh runs on a customer box, in a fresh venv.
      - run: |
          "$RUNNER_TEMP/console-venv/bin/pip" install --require-hashes -r requirements.txt
          "$RUNNER_TEMP/console-venv/bin/pip" check
          "$RUNNER_TEMP/console-venv/bin/python" -c "import flask, werkzeug, gunicorn, psutil, yaml, stun"

  # 3. The private security/smoke scanners (redteam-selfaudit scan.py, pre-merge-check
  #    smoke.py and check-template-js.py). They are tooling, not product, so they are NOT in
  #    this public repo: they live in the private takwerx/infra-TAK-notes repo (claude-skills/).
  #    This job runs on a GitHub-hosted runner (ops #1192; it used to need a Studio runner that
  #    was never registered for this repo, so the job sat queued and had to be switched off).
  #    It reads the scanners from the notes repo with a fine-grained, read-only token (only the
  #    notes repo, Contents: read) that lives in the repo secret SCANNERS_READ_TOKEN, used for
  #    that one checkout and the check before it, nothing else. The token lasts one year.
  #
  #    The scanners are static: they read app.py, modules/ and templates/ as text (smoke.py and
  #    scan.py parse with ast, check-template-js.py renders Jinja and runs `node --check`, which
  #    only parses). Nothing from the PR is executed, and the baselines come from the notes repo,
  #    so a PR can't loosen them.
  #
  #    Only runs when the repo variable TIER1_SCANNERS is 'true', and only for PRs from a branch
  #    in this repo: a fork PR gets no secrets from GitHub, so it never runs here. Dependabot PRs
  #    get a separate (empty) secret store, so they are left out too; they only change pins.
  #    A same-repo PR with the secret missing FAILS (the first step says so), it never skips.
  scanners:
    # A push to dev/main is already-merged code in this repo, never a fork's, so it is scanned too.
    if: vars.TIER1_SCANNERS == 'true' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Stop with a clear message when the read token is missing or cannot read the notes repo
        env:
          SCANNERS_READ_TOKEN: ${{ secrets.SCANNERS_READ_TOKEN }}
        run: |
          if [ -z "$SCANNERS_READ_TOKEN" ]; then
            echo "::error::secret SCANNERS_READ_TOKEN is not set. Make a fine-grained read-only token for takwerx/infra-TAK-notes (https://github.com/settings/personal-access-tokens/new) and save it as that secret (https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions), or set TIER1_SCANNERS to false."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $SCANNERS_READ_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/takwerx/infra-TAK-notes || true)
          if [ "$code" != "200" ]; then
            echo "::error::secret SCANNERS_READ_TOKEN cannot read takwerx/infra-TAK-notes (GitHub answered HTTP ${code}). It has probably expired (it lasts one year) or was made for another repo. Make a new one at https://github.com/settings/personal-access-tokens/new and replace the secret."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pr
          persist-credentials: false
          clean: true
      - name: Fetch the scanners from the private notes repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: takwerx/infra-TAK-notes
          ref: main
          token: ${{ secrets.SCANNERS_READ_TOKEN }}
          path: notes
          sparse-checkout: |
            claude-skills/redteam-selfaudit
            claude-skills/pre-merge-check
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Put the scanners in the PR checkout and install jinja2 (from the hashed requirements)
        run: |
          set -euo pipefail
          for s in redteam-selfaudit pre-merge-check; do
            [ -d "notes/claude-skills/$s" ] || { echo "::error::scanner folder not found in the notes repo: claude-skills/$s"; exit 1; }
          done
          mkdir -p pr/.claude/skills
          cp -R notes/claude-skills/redteam-selfaudit notes/claude-skills/pre-merge-check pr/.claude/skills/
          find pr/.claude/skills -name __pycache__ -prune -exec rm -rf {} +
          rm -rf notes
          python -m venv "$RUNNER_TEMP/jv"
          "$RUNNER_TEMP/jv/bin/pip" -q install --require-hashes -r pr/requirements.txt
      - name: Run all three, report every failure
        working-directory: pr
        run: |
          set -u
          fail=0
          echo "::group::redteam-selfaudit scan.py"
          python .claude/skills/redteam-selfaudit/scan.py || { echo "::error::redteam-selfaudit scan.py failed"; fail=1; }
          echo "::endgroup::"
          echo "::group::pre-merge-check smoke.py"
          python .claude/skills/pre-merge-check/smoke.py || { echo "::error::pre-merge-check smoke.py failed"; fail=1; }
          echo "::endgroup::"
          echo "::group::pre-merge-check check-template-js.py"
          "$RUNNER_TEMP/jv/bin/python" .claude/skills/pre-merge-check/check-template-js.py || { echo "::error::check-template-js.py failed"; fail=1; }
          echo "::endgroup::"
          exit "$fail"

  # One stable name to require in branch protection. A skipped scanners job counts as
  # passed; a failed or cancelled one does not.
  checks-ok:
    if: always()
    needs: [compile, shellcheck, pytest, console-deps, scanners]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a required check failed"; exit 1 ;;
          esac
