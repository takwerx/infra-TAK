name: PR checks

# Tier 1: automatic checks on every PR into dev (and main). No Claude involved.
# A red check blocks the merge. Run the same things locally with:
#   python3 -I .github/ci/compile_check.py
#   bash .github/ci/shellcheck_gate.sh
#   python3 -m pytest -q -n auto --basetemp ~/pytest-tmp tests   (basetemp must not be under /tmp; needs pytest-xdist, see .github/ci/requirements-test.txt)
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: setup-python has no 3.9/3.10 builds for
# newer images, and those are the versions RHEL/Rocky 9 and Ubuntu 22.04 ship.
jobs:
  # 1a. Every tracked .py file compiles on the oldest Python we support (RHEL/Rocky 9 = 3.9).
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: python -I .github/ci/compile_check.py
      # simulator/ runs in its own python:3.12 container (simulator/Dockerfile).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -I .github/ci/compile_check.py --only simulator/

  # 1b. shellcheck, errors only, against a baseline of the findings that already existed.
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Pinned so the baseline means the same thing every run (the runner's own shellcheck moves with the image).
      - run: pip install shellcheck-py==0.11.0.1 && shellcheck --version
      - run: bash .github/ci/shellcheck_gate.sh

  # 1c. Which later test tiers this change needs (tools/pick-tests.py, ops #242). Info only:
  #     it writes the checklist to the run summary and never fails the PR.
  pick-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo '### Test tiers this change needs'
            python3 -I tools/pick-tests.py --base "origin/$BASE_REF" --head HEAD || echo 'pick-tests could not run (informational only)'
          } >> "$GITHUB_STEP_SUMMARY"

  # 2. The pytest suite in tests/ (Ubuntu 22.04 ships Python 3.10).
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # tests/test_release_hygiene_ops354.py compares app.py's VERSION with the newest release tag.
      - run: git fetch --depth=1 origin 'refs/tags/v*:refs/tags/v*'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/ci/requirements-test.txt
      - run: pip install -r requirements.txt -r .github/ci/requirements-test.txt
      # --basetemp keeps pytest's temp dirs out of /tmp: some Guard Dog tests rewrite '/tmp/' in the
      # script under test to their own tmp_path, which mangles a tmp_path that is itself under /tmp.
      - run: python -m pytest -q -n 2 --timeout 300 --durations=10 -p no:cacheprovider --basetemp "$RUNNER_TEMP/pytest" tests

  # 3. The private security/smoke scanners (redteam-selfaudit scan.py, pre-merge-check
  #    smoke.py and check-template-js.py). They live in the gitignored .claude/skills/
  #    folder and are mirrored in the private infra-TAK-notes repo, so GitHub-hosted
  #    runners can't see them. This job runs on the Studio's self-hosted runner and
  #    copies them in from there. The scanners are static (they read app.py and the
  #    templates; nothing from the PR is executed), and the baselines come from the
  #    private copy, so a PR can't loosen them.
  #
  #    Only runs when the repo variable TIER1_SCANNERS is 'true' (set it once a runner
  #    is registered for this repo and the baselines are current) and only for PRs from
  #    a branch in this repo, never from a fork.
  scanners:
    if: vars.TIER1_SCANNERS == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, tak-worker]
    timeout-minutes: 15
    env:
      SCANNER_SKILLS_DIR: ${{ vars.SCANNER_SKILLS_DIR || '/Users/andreasjohansson/GitHub/infra-TAK-notes/claude-skills' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - name: Copy the scanners in from the private copy
        run: |
          set -euo pipefail
          for s in redteam-selfaudit pre-merge-check; do
            [ -d "$SCANNER_SKILLS_DIR/$s" ] || { echo "::error::scanner folder not found: $SCANNER_SKILLS_DIR/$s"; exit 1; }
          done
          rm -rf .claude/skills
          mkdir -p .claude/skills
          cp -R "$SCANNER_SKILLS_DIR/redteam-selfaudit" "$SCANNER_SKILLS_DIR/pre-merge-check" .claude/skills/
          find .claude/skills -name __pycache__ -prune -exec rm -rf {} +
          python3 -m venv "$RUNNER_TEMP/jv"
          "$RUNNER_TEMP/jv/bin/pip" -q install jinja2
      - name: Run all three, report every failure
        run: |
          set -u
          fail=0
          echo "::group::redteam-selfaudit scan.py"
          python3 .claude/skills/redteam-selfaudit/scan.py || { echo "::error::redteam-selfaudit scan.py failed"; fail=1; }
          echo "::endgroup::"
          echo "::group::pre-merge-check smoke.py"
          python3 .claude/skills/pre-merge-check/smoke.py || { echo "::error::pre-merge-check smoke.py failed"; fail=1; }
          echo "::endgroup::"
          echo "::group::pre-merge-check check-template-js.py"
          "$RUNNER_TEMP/jv/bin/python" .claude/skills/pre-merge-check/check-template-js.py || { echo "::error::check-template-js.py failed"; fail=1; }
          echo "::endgroup::"
          exit "$fail"

  # One stable name to require in branch protection. A skipped scanners job counts as
  # passed; a failed or cancelled one does not.
  checks-ok:
    if: always()
    needs: [compile, shellcheck, pytest, scanners]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "::error::a required check failed"; exit 1 ;;
          esac
